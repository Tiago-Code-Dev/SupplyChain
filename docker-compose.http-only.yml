# Docker Compose Override - Para desenvolvimento local apenas com HTTP
# Use com: docker-compose -f docker-compose.yml -f docker-compose.http-only.yml up --build

services:
  api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8080
      # Remove variáveis de ambiente relacionadas ao HTTPS
    ports:
      - "5000:8080"   # Apenas HTTP
    volumes: []  # Remove o volume de certificados
