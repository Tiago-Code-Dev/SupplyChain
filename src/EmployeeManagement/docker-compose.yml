version: '3.8'

services:
  # Banco de Dados SQL Server
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: employeemanagement-db
    hostname: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SqlServer@123
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - employeemanagement-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "SqlServer@123" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # API
  api:
    build:
      context: ..  # Sobe um nível para a pasta 'src'
      dockerfile: EmployeeManagement/EmployeeManagement.Api/Dockerfile
    container_name: employeemanagement-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=EmployeeManagementDb;User Id=sa;Password=SqlServer@123;TrustServerCertificate=True
      - Jwt__Secret=YourSuperSecretKeyWithAtLeast32Characters!
      - Jwt__Issuer=EmployeeManagement.Api
      - Jwt__Audience=EmployeeManagement.Client
      - Jwt__AccessTokenExpirationMinutes=15
      - Jwt__RefreshTokenExpirationDays=7
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - employeemanagement-network
    restart: unless-stopped

volumes:
  sqlserver_data:

networks:
  employeemanagement-network:
    driver: bridge