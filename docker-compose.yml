services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: employee-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SqlServer@123
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - employee-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P SqlServer@123 -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./src
      dockerfile: EmployeeManagement/EmployeeManagement.Api/Dockerfile
    container_name: employee-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8080;https://+:8081
      - ASPNETCORE_Kestrel__Certificates__Default__Password=password
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=EmployeeManagement;User Id=sa;Password=SqlServer@123;TrustServerCertificate=True
      - UseInMemoryDatabase=false
      - Jwt__Secret=YourSuperSecretKeyWithAtLeast32Characters!
      - Jwt__Issuer=EmployeeManagement.Api
      - Jwt__Audience=EmployeeManagement.Client
      - Jwt__AccessTokenExpirationMinutes=15
      - Jwt__RefreshTokenExpirationDays=7
      - Cors__AllowedOrigins__0=http://localhost:3000
      - Cors__AllowedOrigins__1=http://localhost:4200
      - Cors__AllowedOrigins__2=http://localhost:5000
      - Cors__AllowedOrigins__3=http://localhost:5173
      - Cors__AllowedOrigins__4=https://localhost:5001
    ports:
      - "5000:8080"
      - "5001:8081"
    volumes:
      - ./certs:/https:ro
    networks:
      - employee-network
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

networks:
  employee-network:
    driver: bridge

volumes:
  sqlserver_data:
